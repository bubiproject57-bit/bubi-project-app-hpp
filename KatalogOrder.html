<!-- KONTEN FITUR KATALOG & TRACKING ORDER -->
<div class="space-y-6 w-full">
  
  <!-- HEADER & FILTER -->
  <div class="glass-card p-6 rounded-3xl shadow-xl bg-white/95 border border-white/60 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h2 class="text-base font-extrabold text-slate-800 uppercase tracking-wider flex items-center">
        <i class="fas fa-boxes text-amber-600 mr-2.5 text-lg"></i>Katalog Produk & Order Tracking
      </h2>
      <p class="text-xs text-slate-500 font-medium mt-1">
        Daftar produk hasil kalkulasi HPP dan riwayat pesanan pelanggan.
      </p>
    </div>

    <!-- Tombol & Search -->
    <div class="flex items-center gap-3 w-full md:w-auto">
      <div class="relative flex-1 md:w-64">
        <input type="text" id="search-katalog" onkeyup="filterTabelKatalog()" placeholder="Cari nama produk..." class="w-full pl-9 pr-4 py-2 text-xs bg-slate-100 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium">
        <i class="fas fa-search absolute left-3 top-2.5 text-slate-400 text-xs"></i>
      </div>
      <button onclick="loadKatalogProduk()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center shrink-0">
        <i class="fas fa-rotate mr-1.5"></i>Refresh
      </button>
    </div>
  </div>

  <!-- TABEL KATALOG PRODUK JADI -->
  <div class="glass-card p-6 rounded-3xl shadow-xl bg-white/95 border border-white/60 space-y-4">
    <div class="flex justify-between items-center border-b border-slate-200/80 pb-3">
      <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider flex items-center">
        <i class="fas fa-list-check text-amber-600 mr-2"></i>Daftar Produk Jadi (Master Produk)
      </h3>
      <span id="total-katalog-badge" class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg">0 Produk</span>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-200 text-[11px] font-extrabold text-slate-500 uppercase tracking-wider bg-slate-50">
            <th class="p-3">ID Produk</th>
            <th class="p-3">Nama Produk</th>
            <th class="p-3 text-right">Total HPP (Modal)</th>
            <th class="p-3 text-center">Margin (%)</th>
            <th class="p-3 text-right">Harga Jual</th>
            <th class="p-3 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody-katalog-produk" class="divide-y divide-slate-100 text-xs font-semibold text-slate-700">
          <tr>
            <td colspan="6" class="p-6 text-center text-slate-400 italic">
              <i class="fas fa-spinner fa-spin mr-2"></i>Memuat data katalog produk...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // Dynamic Handler untuk memuat data katalog saat tab aktif
  document.addEventListener("DOMContentLoaded", function() {
    loadKatalogProduk();
  });

  // Fungsi memuat data dari Sheet Master_Produk
  function loadKatalogProduk() {
    const tbody = document.getElementById("tbody-katalog-produk");
    if (!tbody) return;

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="p-6 text-center text-slate-400 italic">
          <i class="fas fa-spinner fa-spin mr-2 text-amber-600"></i>Mengambil data produk dari database...
        </td>
      </tr>
    `;

    google.script.run
      .withSuccessHandler(renderTabelKatalog)
      .withFailureHandler(err => {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-4 text-center text-rose-500 font-bold">
              Gagal memuat data: ${err.message}
            </td>
          </tr>
        `;
      })
      .getMasterProdukData(); // Fungsi backend di Code.gs
  }

  // Render Data ke Tabel Katalog
  function renderTabelKatalog(data) {
    const tbody = document.getElementById("tbody-katalog-produk");
    const badge = document.getElementById("total-katalog-badge");

    if (!data || data.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="p-6 text-center text-slate-400 italic">
            Belum ada produk tersimpan. Hitung & Simpan Produk baru dari menu Kalkulator HPP.
          </td>
        </tr>
      `;
      if (badge) badge.innerText = "0 Produk";
      return;
    }

    if (badge) badge.innerText = `${data.length} Produk`;

    let html = "";
    data.forEach((item, index) => {
      html += `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="p-3 font-mono font-bold text-amber-600">${item.id || 'PRD-' + (index + 1)}</td>
          <td class="p-3 font-bold text-slate-800">${item.namaProduk}</td>
          <td class="p-3 text-right font-mono text-slate-600">Rp ${formatRupiahText(item.totalHpp)}</td>
          <td class="p-3 text-center">
            <span class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded-md">
              ${item.marginPersen}%
            </span>
          </td>
          <td class="p-3 text-right font-mono font-black text-amber-600 text-sm">Rp ${formatRupiahText(item.hargaJual)}</td>
          <td class="p-3 text-center space-x-1">
            <button onclick="lihatDetailBOM(${index})" title="Lihat Rincian BOM" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition">
              <i class="fas fa-eye text-xs"></i>
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  // Filter pencarian tabel
  function filterTabelKatalog() {
    const input = document.getElementById('search-katalog').value.toLowerCase();
    const rows = document.querySelectorAll('#tbody-katalog-produk tr');

    rows.forEach(row => {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(input) ? '' : 'none';
    });
  }

  // Helper Format Angka
  function formatRupiahText(angka) {
    return Number(angka || 0).toLocaleString('id-ID');
  }
</script>
